# Values for the official Grafana chart with persistence, SMTP, and datasources.
persistence:
  enabled: true
  type: pvc
  size: 10Gi
  accessModes: ["ReadWriteOnce"]

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki-gateway.monitoring.svc.cluster.local
        access: proxy

# SMTP Configuration for Grafana Alerting
assertNoLeakedSecrets: false
grafana.ini:
  server:
    root_url: "https://grafana.yourdomain.com" # Generalized URL
  smtp:
    enabled: true
    host: smtp.gmail.com:587
    user: your-devops-email@gmail.com
    # SECURITY NOTE: In production, inject this via Kubernetes Secrets or HashiCorp Vault. 
    # Hardcoding is shown here for architecture demonstration only.
    password: '<YOUR_APP_PASSWORD_HERE>' 
    skip_verify: false
    from_address: alerts@yourdomain.com
    from_name: Grafana Alerts