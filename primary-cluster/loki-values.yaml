# SimpleScalable Mode Loki Configuration backed by Azure Blob Storage
deploymentMode: SimpleScalable

# Satisfies the default replication_factor of 3 for High Availability
backend:
  replicas: 3
  persistence:
    enabled: true
    size: 10Gi
read:
  replicas: 3
write:
  replicas: 3
  persistence:
    enabled: true
    size: 10Gi

loki:
  auth_enabled: false
  storage:
    type: 'azure'
    bucketNames:
      chunks: '<YOUR_CONTAINER_NAME>'
      ruler: '<YOUR_CONTAINER_NAME>'
      admin: '<YOUR_CONTAINER_NAME>'
    azure:
      account_name: '<YOUR_AZURE_ACCOUNT_NAME>'
      # SECURITY NOTE: Never commit actual cloud keys. Use external secrets operators.
      account_key: '<YOUR_AZURE_ACCOUNT_KEY>'
      container_name: '<YOUR_CONTAINER_NAME>'

  # TSDB schema provides highly efficient querying and lower storage costs
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_tsdb_index_
          period: 24h

chunksCache:
  allocatedMemory: 1024 # Restricts the internal cache memory pool size to 1 GiB to prevent OOM
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi