# Production config with remote write receiver enabled
alertmanager:
  enabled: true
grafana:
  enabled: false

prometheus:
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: true
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    
    # 15-day local retention for the central hub
    retention: 15d

    # --- Remote Write Receiver ---
    # This allows secondary clusters to push metrics here over the internet
    enableRemoteWriteReceiver: true
    remoteWriteDashboards: true

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi 

    additionalScrapeConfigs:
      - job_name: 'external-manual-target'
        static_configs:
          - targets: ['<EXTERNAL_IP>:8002']
            labels:
              instance: 'external-server-8002'
              region: 'external'
              cluster: 'manual-target'
        metrics_path: /metrics